name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:   # a verification build on any ref; publishes nothing
jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    env:
      # Job-level: a step's own env is not in scope for its `if`.
      TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      # The image's default is Xcode 16.4 (Swift 6.0, macOS 15 SDK); the app is
      # built and tested against the Swift 6.2 / macOS 26 toolchain locally.
      - run: sudo xcode-select -s /Applications/Xcode_26.3.app && xcodebuild -version
      - run: brew install xcodegen
      - name: Version (project.yml is the source; xcodegen writes the plist)
        run: |
          V="${GITHUB_REF_NAME#v}"; [ "$GITHUB_REF_TYPE" = tag ] || V="0.0.0"
          sed -i '' -E "s/^( *CFBundle(ShortVersionString|Version): ).*/\1\"$V\"/" project.yml
          xcodegen generate
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Sources/Cutaway/Info.plist)" = "$V" ]
          echo "V=$V" >> "$GITHUB_ENV"
      - name: Test
        run: xcodebuild -project Cutaway.xcodeproj -scheme Cutaway -destination 'platform=macOS' test -only-testing:CutawayTests
      - name: Build (ad-hoc signed — Developer ID parked by decision 1)
        run: |
          xcodebuild -project Cutaway.xcodeproj -scheme Cutaway -configuration Release -destination 'platform=macOS' -derivedDataPath build build
          APP=build/Build/Products/Release/Cutaway.app
          codesign --force --deep --sign - "$APP" && codesign --verify --deep --strict "$APP"
          ditto -c -k --keepParent "$APP" "Cutaway-$V.zip"
          shasum -a 256 "Cutaway-$V.zip" | cut -d' ' -f1 > sha256.txt
      - name: Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        # A tag made by scripts/release.sh already has its release; then this run is a second verification build.
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" "Cutaway-$V.zip" --title "Cutaway $V" --generate-notes
      - name: Bump cask
        if: github.ref_type == 'tag' && env.TAP_TOKEN != ''
        run: |
          SHA=$(cat sha256.txt)
          git clone -q "https://x-access-token:${TAP_TOKEN}@github.com/svanlink/homebrew-tap" tap
          sed -i '' "s/version \".*\"/version \"$V\"/; s/sha256 \".*\"/sha256 \"$SHA\"/" tap/Casks/cutaway.rb
          git -C tap -c user.name=cutaway-ci -c user.email=ci@vaneickelen.com commit -aqm "cutaway $V"
          git -C tap push -q
