name: Cutaway
options:
  bundleIdPrefix: com.vaneickelen
  developmentLanguage: en
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

targets:
  Cutaway:
    type: application
    platform: macOS
    sources:
      - Sources/Cutaway
      - path: Resources
        buildPhase: resources
    info:
      path: Sources/Cutaway/Info.plist
      properties:
        CFBundleDisplayName: Cutaway
        CFBundleName: Cutaway
        CFBundleIconFile: AppIcon
        LSMinimumSystemVersion: "14.0"
        # xcodegen regenerates Info.plist from these on every `generate` —
        # so the version and metadata live HERE, never edited in the plist.
        # release.sh stamps this file, then regenerates.
        CFBundleShortVersionString: "1.5.0"
        CFBundleVersion: "1.5.0"
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "© 2026 Sebastian van Eickelen"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vaneickelen.cutaway
        PRODUCT_NAME: Cutaway
        SWIFT_VERSION: "6.0"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        GENERATE_INFOPLIST_FILE: false
      configs:
        Release:
          # Release ONLY, deliberately. Hardened runtime turns on library
          # validation, and an ad-hoc signature carries no Team ID for nested
          # code to match — so a Debug build, which ships a Cutaway.debug.dylib
          # beside the binary, aborts on launch with "different Team IDs".
          # The Release bundle has no nested code at all (verified: no
          # Frameworks, no dylibs), so it hardens cleanly. It composes with
          # ad-hoc signing and needs no notarization for the kernel to enforce
          # it: measured, an inserted DYLD_INSERT_LIBRARIES is stripped with
          # the runtime on and loads with it off. This app holds Accessibility
          # and spawns a subprocess, so that is worth closing.
          ENABLE_HARDENED_RUNTIME: true
          SWIFT_COMPILATION_MODE: wholemodule
          COPY_PHASE_STRIP: true
          DEAD_CODE_STRIPPING: true
          DEPLOYMENT_POSTPROCESSING: true

  CutawayTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/CutawayTests
    dependencies:
      - target: Cutaway
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Cutaway.app/Contents/MacOS/Cutaway"
        BUNDLE_LOADER: "$(TEST_HOST)"

  CutawayUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - Tests/CutawayUITests
    dependencies:
      - target: Cutaway
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: true

schemes:
  Cutaway:
    build:
      targets:
        Cutaway: all
    test:
      targets:
        - CutawayTests
        - CutawayUITests
